app = "orbpondering"
primary_region = "ord"

[build]
  dockerfile = "web/Dockerfile"

[env]
  ORBPONDERING_API_KEY = ""
  DJANGO_SECRET_KEY = ""
  DJANGO_DEBUG = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
