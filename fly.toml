# fly.toml app configuration file generated for orbpondering on 2026-05-30T22:12:40+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'orbpondering'
primary_region = 'ord'

[build]
  dockerfile = 'web/Dockerfile'

[env]
  DJANGO_DB_PATH = '/data/orbpondering.db'
  DJANGO_DEBUG = 'false'
  DJANGO_SECRET_KEY = ''
  ORBPONDERING_API_KEY = ''
  XDG_CACHE_HOME = '/data/cache'

[[mounts]]
  source = 'orbpondering_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
