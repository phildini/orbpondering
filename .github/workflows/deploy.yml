name: Deploy to Fly.io
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'phildini/orbpondering'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@1.5
        with:
          args: deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
