name: Publish Package
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0). Leave blank to auto-detect from git tag.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  build:
    environment: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            **/pyproject.toml
            **/uv.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Extract version from git tag
            TAG_NAME="${GITHUB_REF##*/}"
            if [[ "$TAG_NAME" == v* ]]; then
              echo "version=$TAG_NAME" >> $GITHUB_OUTPUT
            else
              echo "version=v0.1.0" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set version in package
        run: |
          hatch version ${{ steps.get_version.outputs.version }}

      - name: Build package
        run: |
          hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true