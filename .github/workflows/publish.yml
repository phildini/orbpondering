name: Publish to PyPI
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0). Leave blank for auto-detect.'
        required: false
        default: ''
permissions:
  contents: read
  id-token: write
jobs:
  build:
    environment: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Get Version
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Auto-detect from git tag
            TAG=$(git describe --tags --exact-match 2>/dev/null || echo "v0.1.0")
            echo "version=$TAG" >> $GITHUB_OUTPUT
          fi
      - name: Set up Hatch
        run: |
          python -m pip install --upgrade hatch
      - name: Build package
        run: |
          hatch version ${{ steps.version.outputs.version }}
          hatch build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true