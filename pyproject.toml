[project]
name = "orbpondering"
dynamic = ["version"]
description = "Tarot spreads seeded by daily astrological calculations"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Philip James", email = "phildini@phildini.net"},
]
maintainers = [
    {name = "Philip James", email = "phildini@phildini.net"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Artistic Software",
    "Topic :: Scientific/Engineering :: Astronomy",
]
keywords = ["tarot", "astrology", "horoscope", "divination", "esoteric", "natal", "transit"]
dependencies = [
    "astropy>=6.0",
    "jplephem>=2.14",
    "numpy>=1.26",
]

[project.optional-dependencies]
cli = [
    "rich>=13.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
orbpondering = "orbpondering.__main__:main"

[project.urls]
Homepage = "https://github.com/phildini/orbpondering"
Documentation = "https://github.com/phildini/orbpondering/blob/main/README.md"
Repository = "https://github.com/phildini/orbpondering"
Issues = "https://github.com/phildini/orbpondering/issues"
Changelog = "https://github.com/phildini/orbpondering/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/orbpondering/__init__.py"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbpondering"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
