{% extends "frontend/base.html" %}
{% block title %}New Reading{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <h1 class="text-3xl font-bold text-primary mb-2">New Reading</h1>
  <p class="text-base-content/70 mb-8">Set your date and location to seed the astrological draw.</p>

  <form method="post" action="{% url 'reading-form' %}"
        class="card bg-base-200 p-6 space-y-4">
    {% csrf_token %}

    <div class="form-control">
      <label class="label"><span class="label-text">Date</span></label>
      <input type="date" name="date" value="{{ today }}" class="input input-bordered w-full">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="form-control">
        <label class="label"><span class="label-text">Latitude</span></label>
        <input type="number" step="any" name="lat" value="0.0" placeholder="40.7128"
               class="input input-bordered w-full">
      </div>
      <div class="form-control">
        <label class="label"><span class="label-text">Longitude</span></label>
        <input type="number" step="any" name="lon" value="0.0" placeholder="-74.0060"
               class="input input-bordered w-full">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="form-control">
        <label class="label"><span class="label-text">House System</span></label>
        <select name="house_system" class="select select-bordered w-full">
          <option value="whole_sign" selected>Whole Sign</option>
          <option value="equal">Equal</option>
          <option value="porphyry">Porphyry</option>
          <option value="placidus">Placidus</option>
        </select>
      </div>
      <div class="form-control">
        <label class="label"><span class="label-text">Spread</span></label>
        <select name="spread" class="select select-bordered w-full">
          <option value="daily" selected>Daily (1 card)</option>
          <option value="three_card">Three Card</option>
          <option value="celtic_cross">Celtic Cross</option>
        </select>
      </div>
    </div>

    <div class="form-control">
      <label class="label cursor-pointer justify-start gap-4">
        <input type="checkbox" name="reversed" class="checkbox checkbox-accent">
        <span class="label-text">Enable reversed cards</span>
      </label>
    </div>

    <details class="collapse collapse-arrow bg-base-300">
      <summary class="collapse-title text-sm font-medium text-accent">Natal Chart Mode (optional)</summary>
      <div class="collapse-content space-y-3 pt-3">
        <div class="grid grid-cols-2 gap-4">
          <div class="form-control">
            <label class="label"><span class="label-text">Birth Date</span></label>
            <input type="date" name="birth_date" class="input input-bordered w-full">
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text">Birth Time</span></label>
            <input type="time" name="birth_time" class="input input-bordered w-full">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="form-control">
            <label class="label"><span class="label-text">Birth Latitude</span></label>
            <input type="number" step="any" name="birth_lat" value="0.0" class="input input-bordered w-full">
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text">Birth Longitude</span></label>
            <input type="number" step="any" name="birth_lon" value="0.0" class="input input-bordered w-full">
          </div>
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Time Zone</span></label>
          <input type="text" name="birth_tz" placeholder="America/New_York" class="input input-bordered w-full">
        </div>
      </div>
    </details>

    <button type="submit" class="btn btn-primary btn-block">
      ✦ Calculate Reading
    </button>
  </form>
</div>
{% endblock %}
