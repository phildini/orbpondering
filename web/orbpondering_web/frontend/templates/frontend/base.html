{% load static %}<!DOCTYPE html>
<html data-theme="synthwave" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbpondering — {% block title %}Tarot &amp; Astrology{% endblock %}</title>
  <link href="{% static 'css/output.css' %}" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" crossorigin="anonymous"></script>
  <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
</head>
<body class="min-h-screen bg-base-300">
  <div class="navbar bg-base-100 border-b border-secondary/20">
    <div class="flex-1">
      <a href="{% url 'index' %}" class="btn btn-ghost text-xl text-primary">
        ✦ Orbpondering
      </a>
    </div>
    <div class="flex-none gap-2">
      <a href="{% url 'reading-form' %}" class="btn btn-outline btn-accent btn-sm">
        New Reading
      </a>
    </div>
  </div>

  <main class="container mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
