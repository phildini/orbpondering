[project]
name = "orbpondering-web"
version = "0.1.0"
description = "Web interface for Orbpondering tarot and astrology"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.0",
    "whitenoise>=6.0",
    "gunicorn>=22.0",
    "django-stagedoor",
    "django-anymail>=12.0",
    "orbpondering",
]

[tool.uv]
package = true

[tool.uv.sources]
orbpondering = { path = "../" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.0",
]

[project.scripts]
build-css = "orbpondering_web.dev:build_css"
watch-css = "orbpondering_web.dev:watch_css"
dev = "orbpondering_web.dev:dev"
devserver = "orbpondering_web.dev:devserver"
collectstatic = "orbpondering_web.dev:collectstatic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbpondering_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "orbpondering_web.settings"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
